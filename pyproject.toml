[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-bi"
version = "0.1.0"
description = "智能问数桌面应用 - 通过自然语言获取数据、生成 SQL 脚本和存储过程"
authors = [{ name = "Smart BI Team" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",

    # Database
    "sqlalchemy>=2.0.25",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "duckdb>=0.10.0",
    "aiosqlite>=0.19.0",

    # LLM
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "httpx>=0.27.0",
    "tiktoken>=0.5.2",

    # RAG / Vector
    "chromadb>=0.4.24",
    "sentence-transformers>=2.5.1",

    # SQL tooling
    "sqlglot>=20.0.0",
    "sqlfluff>=2.3.0",

    # Data / Charts
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",

    # Desktop shell
    "pywebview>=5.0",

    # Utils
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "click>=8.1.7",
    "tenacity>=8.2.3",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
smart-bi = "backend.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["frontend*", "examples*", "packaging*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
